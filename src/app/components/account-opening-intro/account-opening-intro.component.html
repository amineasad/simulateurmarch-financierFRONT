<div class="intro-container">
  <h1>Demande d’ouverture de compte en ligne</h1>
  <p class="subtitle">en 4 étapes</p>

  <div class="steps">
    <div class="step">
      <div class="step-number">1</div>
      <h3>Je complète</h3>
      <p>mon formulaire en ligne en moins de 5 minutes</p>
    </div>

    <div class="step">
      <div class="step-number">2</div>
      <h3>Je télécharge</h3>
      <p>mes pièces justificatives</p>
    </div>

    <div class="step">
      <div class="step-number">3</div>
      <h3>Je signe</h3>
      <p>les documents relatifs à l’ouverture du compte</p>
    </div>

    <div class="step">
      <div class="step-number">4</div>
      <h3>J’effectue</h3>
      <p>mon premier versement pour activer mon compte</p>
    </div>
  </div>

  <button class="start-btn" (click)="goToSignupChoice()">
    Je commence l’ouverture de mon compte en ligne
  </button>
</div>
